[package]
name = "campaign-desktop"
version = "0.1.0"
description = "Campaign desktop shell for macOS and Windows"
authors = []
edition = "2021"

[lib]
name = "campaign_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
